<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Beecoming Student Portal</title>
    <link rel="icon" href="/wp-content/themes/mingque/favicon.ico" />
    <style>
      :root {
        --ink: #171b2a;
        --muted: #6f7586;
        --line: #e3e7ef;
        --soft: #f6f4ff;
        --surface: #ffffff;
        --purple: #6f42ff;
        --purple-dark: #5631db;
        --blue: #3057f3;
        --yellow: #ffc72c;
        --green: #18a058;
        --orange: #f59e0b;
        --shadow: 0 18px 50px rgba(29, 23, 74, 0.09);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 88% 8%, rgba(255, 199, 44, 0.18), transparent 28rem),
          radial-gradient(circle at 0 0, rgba(111, 66, 255, 0.12), transparent 31rem),
          #fbfbff;
      }

      button,
      input,
      select {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        /* dvh tracks the visible area; on mobile Safari 100vh is the
           toolbar-collapsed height, which pads dead space below the content */
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 23rem minmax(0, 1fr);
      }

      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100dvh;
        padding: 2rem 1.5rem;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(18px);
        overflow: auto;
      }

      .brand {
        display: grid;
        gap: 0.75rem;
      }

      .brand img {
        width: min(15rem, 82vw);
        height: auto;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.65rem;
        font-size: clamp(2rem, 4.6vw, 3.3rem);
        line-height: 1.03;
        letter-spacing: 0;
      }

      .side-title {
        margin: 1.8rem 0 1rem;
        font-size: 1.55rem;
        line-height: 1.12;
      }

      .muted {
        color: var(--muted);
      }

      .panel {
        margin-top: 1.4rem;
        padding: 1.1rem;
        border: 1px solid var(--line);
        border-radius: 1.2rem;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .field {
        display: grid;
        gap: 0.45rem;
        margin-top: 1rem;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      select {
        width: 100%;
        min-height: 3rem;
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        background: #fff;
        color: var(--ink);
        padding: 0 0.85rem;
      }

      .btn {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        border: 1px solid var(--line);
        border-radius: 0.95rem;
        background: #fff;
        color: var(--ink);
        padding: 0 1.1rem;
        font-weight: 900;
        cursor: pointer;
      }

      .btn.primary {
        border-color: var(--purple);
        background: var(--purple);
        color: #fff;
        box-shadow: 0 10px 24px rgba(111, 66, 255, 0.24);
      }

      .btn.full {
        width: 100%;
      }

      .feishu-dot {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 0.32rem;
        background: linear-gradient(135deg, #2f6bff, #00c8a4);
        display: inline-block;
      }

      .account {
        display: grid;
        gap: 0.2rem;
        padding: 0.9rem;
        border-radius: 0.9rem;
        background: var(--soft);
      }

      .main {
        min-width: 0;
        padding: 2rem clamp(1rem, 3vw, 2.4rem) 4rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.2rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 2rem;
        padding: 0 0.75rem;
        border-radius: 999px;
        background: var(--soft);
        color: var(--purple-dark);
        font-weight: 900;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(18rem, 0.8fr);
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 1.2rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .profile {
        padding: clamp(1.1rem, 3vw, 1.8rem);
      }

      .student-name {
        margin-bottom: 0.85rem;
        font-size: clamp(1.75rem, 5vw, 3.6rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 0.45rem 0.7rem;
        color: var(--muted);
        font-weight: 850;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.7rem;
        padding: 1rem;
      }

      .stat {
        min-height: 5.5rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: #fff;
        padding: 0.85rem;
      }

      .stat span {
        color: var(--muted);
        font-weight: 850;
      }

      .stat strong {
        display: block;
        margin-top: 0.4rem;
        font-size: clamp(1.75rem, 4vw, 2.45rem);
        line-height: 1;
      }

      .tabs {
        position: sticky;
        top: 0;
        z-index: 8;
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        padding: 0.55rem;
        border: 1px solid var(--line);
        border-radius: 1.1rem;
        background: rgba(246, 248, 252, 0.94);
        backdrop-filter: blur(16px);
      }

      .tabs button {
        flex: 1;
        min-height: 3rem;
        border: 0;
        border-radius: 0.85rem;
        background: transparent;
        color: var(--muted);
        font-weight: 950;
        cursor: pointer;
      }

      .tabs button.active {
        background: var(--blue);
        color: #fff;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1rem 0;
      }

      .section-head h3 {
        margin-bottom: 0.6rem;
        font-size: 1.35rem;
      }

      .guidance {
        margin: 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #f3efff;
        color: var(--purple-dark);
        padding: 1rem;
        font-size: clamp(1.05rem, 2.5vw, 1.22rem);
        line-height: 1.55;
        font-weight: 900;
      }

      .category-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        padding: 1rem;
      }

      .category-pills span {
        border-radius: 999px;
        background: #f1eaff;
        color: var(--purple-dark);
        padding: 0.5rem 0.8rem;
        font-weight: 950;
      }

      .timeline,
      .activity-list {
        display: grid;
        gap: 1rem;
      }

      .term-card {
        overflow: hidden;
      }

      .term-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        border-bottom: 1px solid var(--line);
      }

      .term-head h3 {
        margin: 0;
        font-size: 1.25rem;
      }

      .term-total {
        color: var(--muted);
        font-weight: 900;
        white-space: nowrap;
      }

      .course-row {
        display: grid;
        grid-template-columns: minmax(12rem, 1.3fr) minmax(9rem, 0.85fr) 5.5rem 6.2rem;
        gap: 0.8rem;
        align-items: center;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--line);
      }

      .course-row:last-child {
        border-bottom: 0;
      }

      .course-title,
      .activity-name {
        font-weight: 950;
      }

      .course-code,
      .school,
      .activity-note,
      .activity-time,
      .activity-hours {
        color: var(--muted);
        font-weight: 760;
      }

      .status,
      .activity-status {
        display: inline-flex;
        justify-content: center;
        border-radius: 999px;
        padding: 0.35rem 0.65rem;
        font-size: 0.86rem;
        font-weight: 950;
        white-space: nowrap;
      }

      .done {
        background: #e7f7ef;
        color: var(--green);
      }

      .now {
        background: #eaf0ff;
        color: var(--blue);
      }

      .next {
        background: #fff4db;
        color: #a26000;
      }

      .planned {
        background: #f0e8ff;
        color: var(--purple-dark);
      }

      .activity-row {
        display: grid;
        /* Floor is ~46rem so the six columns still fit once the sidebar
           collapses; wider columns overflowed on 1280px laptops. */
        grid-template-columns: minmax(7rem, 0.9fr) 7rem minmax(9rem, 1.4fr) 6.5rem 4.5rem minmax(8rem, 1.3fr);
        gap: 0.8rem;
        align-items: center;
        padding: 0.95rem 1rem;
        border-top: 1px solid var(--line);
      }

      .activity-category {
        color: var(--purple-dark);
        font-weight: 950;
      }

      .empty {
        min-height: 26rem;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: var(--muted);
        font-weight: 900;
        text-align: center;
      }

      .login-page {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }

      .login-card {
        width: min(58rem, 100%);
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        overflow: hidden;
      }

      .login-art {
        display: grid;
        align-content: space-between;
        min-height: 30rem;
        padding: 2rem;
        background:
          linear-gradient(135deg, rgba(111, 66, 255, 0.9), rgba(48, 87, 243, 0.82)),
          url("/wp-content/uploads/2024/06/微信图片_20240603112349-1024x573.png") center / cover;
        color: #fff;
      }

      .login-art img {
        width: 13rem;
        filter: brightness(0) invert(1);
      }

      .login-body {
        padding: clamp(1.4rem, 4vw, 3rem);
        background: #fff;
      }

      .login-body h1 {
        font-size: clamp(2.4rem, 7vw, 4.3rem);
      }

      .error-box {
        margin-top: 1rem;
        padding: 0.8rem;
        border-radius: 0.9rem;
        background: #fff2f0;
        color: #b42318;
        font-weight: 850;
      }

      .hidden {
        display: none !important;
      }

      /* Sidebar folds into a header bar well before the tables stop fitting:
         with a 23rem sidebar the content column is too narrow for the
         activity table until ~1240px, so collapsing here (rather than at
         980px) is what keeps the desktop table layout usable on laptops. */
      @media (max-width: 1240px) {
        .shell {
          grid-template-columns: 1fr;
        }

        /* Sidebar collapses to a slim header bar so content starts near the top */
        /* Only the tab bar stays pinned on phones — two sticky bars eat too
           much of a small screen, and the header height varies with the
           student switcher. */
        .side {
          position: relative;
          height: auto;
          overflow: visible;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 0.6rem 0.75rem;
          padding: 0.7rem 0.9rem;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .side-title,
        .brand .eyebrow {
          display: none;
        }

        .brand {
          gap: 0;
        }

        .brand img {
          width: 8.5rem;
        }

        .panel {
          flex: 1 1 auto;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: flex-end;
          gap: 0.5rem 0.6rem;
          margin-top: 0;
          padding: 0;
          border: 0;
          border-radius: 0;
          background: none;
          box-shadow: none;
        }

        .panel .account {
          padding: 0.3rem 0.6rem;
          border-radius: 0.6rem;
          font-size: 0.92rem;
        }

        .panel .account .muted {
          display: none;
        }

        .panel .btn.full {
          width: auto;
          min-height: 2.3rem;
          margin-top: 0 !important;
          padding: 0 0.7rem;
          font-size: 0.9rem;
        }

        /* Student switcher drops below the account row, not between it and
           the logout button (order keeps the first line intact) */
        .panel .field {
          order: 2;
          flex: 1 1 100%;
          gap: 0;
          margin-top: 0;
          font-size: 0;
        }

        .panel .field select {
          min-height: 2.6rem;
          font-size: 0.95rem;
        }

        .topbar {
          display: none;
        }
      }

      /* Tables turn into cards once they stop fitting the full-width content
         column. Width alone can't tell a narrow desktop window from a phone
         held sideways, so touch devices (pointer: coarse) switch at a much
         wider 1100px — a six-column table is unreadable on a handset even
         when it technically fits. */
      @media (max-width: 820px), (max-width: 1100px) and (pointer: coarse) {
        .hero,
        .login-card {
          grid-template-columns: 1fr;
        }

        .login-art {
          min-height: 16rem;
        }

        /* Course row → two-column card: title + status, then school + credits */
        .course-row {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.35rem 0.6rem;
          padding: 0.85rem 0.9rem;
        }

        .course-row > :nth-child(1) {
          grid-column: 1;
          grid-row: 1;
        }

        .course-row > .status {
          grid-column: 2;
          grid-row: 1;
          justify-self: end;
          align-self: start;
        }

        .course-row > .school {
          grid-column: 1;
          grid-row: 2;
          align-self: center;
        }

        .course-row > .credits {
          grid-column: 2;
          grid-row: 2;
          justify-self: end;
          align-self: center;
          white-space: nowrap;
        }

        /* Activity row → category + status, then name, meta, note */
        .activity-row {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.3rem 0.6rem;
          padding: 0.9rem;
        }

        .activity-row > .activity-category {
          grid-column: 1;
          grid-row: 1;
          align-self: center;
        }

        .activity-row > .activity-status {
          grid-column: 2;
          grid-row: 1;
          justify-self: end;
        }

        .activity-row > .activity-name {
          grid-column: 1 / -1;
          grid-row: 2;
        }

        .activity-row > .activity-time {
          grid-column: 1;
          grid-row: 3;
        }

        .activity-row > .activity-hours {
          grid-column: 2;
          grid-row: 3;
          justify-self: end;
          white-space: nowrap;
        }

        .activity-row > .activity-note {
          grid-column: 1 / -1;
          grid-row: 4;
        }

        .activity-row > .activity-note:empty {
          display: none;
        }
      }

      /* Phone typography — also applied to handsets in landscape, which are
         wider than 560px but still read at arm's length. */
      @media (max-width: 560px), (max-width: 950px) and (pointer: coarse) {
        .main {
          padding: 1rem 0.75rem 1.25rem;
        }

        .empty {
          min-height: 12rem;
        }

        .stats {
          grid-template-columns: 1fr 1fr;
          padding: 0.7rem;
        }

        .stat {
          min-height: 4.6rem;
          padding: 0.72rem;
        }

        /* Keep secondary text readable on phones instead of shrinking it */
        .stat span,
        .term-total,
        .tag,
        .course-code,
        .school,
        .activity-time,
        .activity-hours,
        .activity-note {
          font-size: 0.95rem;
        }

        .stat strong {
          font-size: 1.9rem;
        }

        .course-title,
        .activity-name {
          font-size: 1.06rem;
          line-height: 1.35;
        }

        .activity-category {
          font-size: 0.95rem;
        }

        .status,
        .activity-status {
          font-size: 0.9rem;
          padding: 0.3rem 0.6rem;
        }

        .student-name {
          font-size: 2.15rem;
        }

        .term-head {
          padding: 0.85rem 0.9rem;
        }

        .term-head h3 {
          font-size: 1.15rem;
        }

        .section-head {
          padding: 0.9rem 0.9rem 0;
        }

        .guidance {
          padding: 0.85rem 0.9rem;
          font-size: 1rem;
        }

        .category-pills {
          gap: 0.45rem;
          padding: 0.85rem 0.9rem;
        }

        .category-pills span {
          padding: 0.42rem 0.7rem;
          font-size: 0.9rem;
        }

        .tabs {
          border-radius: 0.95rem;
        }

        .tabs button {
          font-size: 1rem;
        }

        .login-page {
          align-items: stretch;
        }

        .login-art {
          min-height: 13rem;
          padding: 1.2rem;
        }

        .login-art img {
          width: 11rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="login-page">
      <div class="login-card card">
        <div class="login-art">
          <img src="/assets/beecoming-portal/logo.png" alt="Beecoming" />
          <div>
            <p class="eyebrow" style="color: rgba(255,255,255,.78)">Beecoming Student Portal</p>
            <h1>学生档案</h1>
          </div>
        </div>
        <div class="login-body">
          <p class="eyebrow">飞书账号登录</p>
          <h1>查看课程与课外活动</h1>
          <p class="muted">学生登录后只能看到自己的档案；家长登录后只能看到已绑定孩子的档案。</p>
          <a id="loginButton" class="btn primary full" href="#"><span class="feishu-dot"></span>使用飞书账号登录</a>
          <div id="statusText" class="error-box hidden"></div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "https://beecoming-student-portal.chaihuanzhen.chatgpt.site";
      const CATEGORIES = ["Education Program", "Internship", "Extracurricular Activities", "Volunteer", "Awards"];
      const ACTIVITY_STATUSES = ["进行中", "已完成", "待完成", "已确定会安排"];

      const app = document.getElementById("app");
      const statusText = document.getElementById("statusText");
      const loginButton = document.getElementById("loginButton");
      loginButton.href = `${API_BASE}/api/auth/feishu/start?return_to=${encodeURIComponent(location.href)}`;

      let db = null;
      let activeTab = localStorage.getItem("beecomingPortalTab") || "courses";
      let selectedStudentId = localStorage.getItem("beecomingPortalStudent") || "";

      const escapeHtml = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[char]);

      const number = (value) => Number(value) || 0;
      const formatNumber = (value) => {
        const parsed = number(value);
        return Number.isInteger(parsed) ? String(parsed) : parsed.toFixed(1);
      };

      const studentId = (student) => student?.id || student?.sourceName || "";
      const studentLabel = (student) => {
        if (!student) return "";
        if (student.chineseName && student.englishName) return `${student.chineseName} / ${student.englishName}`;
        return student.preferredName || student.englishName || student.chineseName || student.sourceName || student.id || "";
      };

      const parseTerm = (term = "") => {
        const match = String(term).match(/(20\d{2})\s*(spring|summer|fall|winter)/i);
        const order = { winter: 0, spring: 1, summer: 2, fall: 3 };
        return match ? Number(match[1]) * 10 + order[match[2].toLowerCase()] : 99999;
      };

      const statusClass = (status = "") => ({
        "已完成": "done",
        "进行中": "now",
        "待完成": "next",
        "待确认": "next",
        "已确定会安排": "planned",
      }[status] || "next");

      const normalizeActivityStatus = (status = "") => ACTIVITY_STATUSES.includes(status) ? status : "待完成";

      async function loadSession() {
        try {
          const response = await fetch(`${API_BASE}/api/session`, {
            credentials: "include",
            cache: "no-store",
          });
          if (response.status === 401) {
            showLogin("");
            return;
          }
          if (response.status === 403) {
            showLogin("这个飞书账号还没有绑定学生，请联系 Beecoming 老师在账号绑定表里设置。");
            return;
          }
          if (!response.ok) throw new Error("后台暂时没有连接成功，请稍后重试。");
          db = await response.json();
          renderPortal();
        } catch (error) {
          showLogin(error.message || "后台暂时没有连接成功，请稍后重试。");
        }
      }

      function showLogin(message) {
        document.body.classList.remove("portal-ready");
        if (message) {
          statusText.textContent = message;
          statusText.classList.remove("hidden");
        } else {
          statusText.classList.add("hidden");
        }
      }

      function sortedStudents() {
        return [...(db?.students || [])].sort((a, b) =>
          String(a.cohort || "").localeCompare(String(b.cohort || ""), "zh-Hans-CN", { numeric: true }) ||
          String(a.englishName || a.preferredName || a.chineseName || "").localeCompare(String(b.englishName || b.preferredName || b.chineseName || ""), "en", { sensitivity: "base" })
        );
      }

      function getSelectedStudent() {
        const students = sortedStudents();
        return students.find((student) => studentId(student) === selectedStudentId) || students[0] || null;
      }

      function studentCourses(student) {
        return (db?.courses || [])
          .filter((course) => course.studentId === studentId(student))
          .sort((a, b) => String(a.title || a.rawCourse || a.courseCode || "").localeCompare(String(b.title || b.rawCourse || b.courseCode || ""), "en", { numeric: true, sensitivity: "base" }));
      }

      function studentActivities(student) {
        return (db?.activities || [])
          .filter((activity) => activity.studentId === studentId(student))
          .sort((a, b) => `${a.activityTime || ""} ${a.category || ""} ${a.name || ""}`.localeCompare(`${b.activityTime || ""} ${b.category || ""} ${b.name || ""}`, "zh-Hans-CN", { numeric: true, sensitivity: "base" }));
      }

      function renderPortal() {
        const students = sortedStudents();
        const student = getSelectedStudent();
        if (!student) {
          app.className = "empty";
          app.textContent = "暂时没有学生数据";
          return;
        }

        const courses = studentCourses(student);
        const activities = studentActivities(student);
        const summary = activeTab === "activities" ? activitySummary(activities) : creditSummary(courses);

        app.className = "shell";
        app.innerHTML = `
          <aside class="side">
            <div class="brand">
              <img src="/assets/beecoming-portal/logo.png" alt="Beecoming" />
              <div>
                <p class="eyebrow">Beecoming Student Portal</p>
                <h2 class="side-title">学生档案</h2>
              </div>
            </div>
            <div class="panel">
              <div class="account">
                <strong>${escapeHtml(db.user?.name || "已登录账号")}</strong>
                <span class="muted">${escapeHtml(roleLabel(db.user?.role))}账号 · 可查看 ${students.length} 个学生</span>
              </div>
              ${students.length > 1 ? studentSelect(students, student) : ""}
              <a class="btn full" style="margin-top: 1rem" href="${API_BASE}/api/logout?return_to=${encodeURIComponent(location.href)}">退出登录</a>
            </div>
          </aside>
          <main class="main">
            <div class="topbar">
              <span class="pill">只读档案</span>
              <a class="btn" href="${API_BASE}/api/logout?return_to=${encodeURIComponent(location.href)}">退出登录</a>
            </div>
            <section class="hero">
              <article class="profile card">
                <p class="eyebrow">Student Profile</p>
                <h1 class="student-name">${escapeHtml(studentLabel(student))}</h1>
                <div class="tags">
                  <span class="tag">${escapeHtml(student.cohort || "未分届")}</span>
                  <span class="tag">${escapeHtml(student.campus || "未填校区")}</span>
                  <span class="tag">${escapeHtml(student.currentGrade || "未填年级")}</span>
                  <span class="tag">${escapeHtml(student.studentStatus || "状态未填")}</span>
                </div>
              </article>
              <aside class="stats card">${summary}</aside>
            </section>
            <nav class="tabs">
              <button type="button" class="${activeTab === "courses" ? "active" : ""}" data-tab="courses">课程 ${courses.length}</button>
              <button type="button" class="${activeTab === "activities" ? "active" : ""}" data-tab="activities">课外活动 ${activities.length}</button>
            </nav>
            <section id="content">${activeTab === "activities" ? renderActivities(activities) : renderCourses(courses, student)}</section>
          </main>
        `;

        app.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            activeTab = button.dataset.tab;
            localStorage.setItem("beecomingPortalTab", activeTab);
            renderPortal();
          });
        });

        const select = app.querySelector("#studentSelect");
        if (select) {
          select.addEventListener("change", (event) => {
            selectedStudentId = event.target.value;
            localStorage.setItem("beecomingPortalStudent", selectedStudentId);
            renderPortal();
          });
        }
      }

      function roleLabel(role = "") {
        if (role === "student") return "学生";
        if (role === "admin") return "老师";
        return "家长";
      }

      function studentSelect(students, selectedStudent) {
        return `
          <label class="field">我的孩子
            <select id="studentSelect">
              ${students.map((student) => `
                <option value="${escapeHtml(studentId(student))}" ${studentId(student) === studentId(selectedStudent) ? "selected" : ""}>
                  ${escapeHtml(studentLabel(student))} · ${escapeHtml(student.cohort || "未分届")} · ${escapeHtml(student.campus || "未填校区")}
                </option>
              `).join("")}
            </select>
          </label>
        `;
      }

      function creditSummary(courses) {
        const totals = courses.reduce((sum, course) => {
          if (course.status === "已完成") sum.done += number(course.credits);
          else if (course.status === "进行中") sum.now += number(course.credits);
          else if (course.status === "待完成") sum.next += number(course.credits);
          sum.all += number(course.credits);
          return sum;
        }, { done: 0, now: 0, next: 0, all: 0 });
        return `
          ${stat("已完成学分", totals.done)}
          ${stat("进行中学分", totals.now)}
          ${stat("待完成学分", totals.next)}
          ${stat("总预计学分", totals.done + totals.now + totals.next)}
        `;
      }

      function activityStats(activities) {
        return activities.reduce((sum, activity) => {
          const status = normalizeActivityStatus(activity.status);
          if (status === "已完成") sum.done += 1;
          if (status === "进行中") sum.now += 1;
          if (status === "待完成") sum.next += 1;
          if (status === "已确定会安排") sum.planned += 1;
          if (activity.category === "Volunteer") sum.volunteerHours += number(activity.volunteerHours);
          return sum;
        }, { done: 0, now: 0, next: 0, planned: 0, volunteerHours: 0 });
      }

      function activitySummary(activities) {
        const totals = activityStats(activities);
        return `
          ${stat("活动进度", `${totals.done + totals.now + totals.planned}/20`)}
          ${stat("已完成", totals.done)}
          ${stat("进行中", totals.now)}
          ${stat("已确定会安排", totals.planned)}
          ${stat("志愿者小时", totals.volunteerHours)}
        `;
      }

      function stat(label, value) {
        return `<div class="stat"><span>${escapeHtml(label)}</span><strong>${typeof value === "number" ? formatNumber(value) : escapeHtml(value)}</strong></div>`;
      }

      function renderCourses(courses, student) {
        const terms = [...new Set([...(student.terms || []), ...courses.map((course) => course.term).filter(Boolean)])]
          .sort((a, b) => parseTerm(a) - parseTerm(b) || String(a).localeCompare(String(b)));
        if (!terms.length) return `<div class="empty card">这个学生暂时没有课程记录</div>`;
        return `<div class="timeline">${terms.map((term) => {
          const items = courses.filter((course) => course.term === term);
          const credits = items.reduce((sum, course) => sum + number(course.credits), 0);
          return `
            <article class="term-card card">
              <div class="term-head"><h3>${escapeHtml(term)}</h3><div class="term-total">${items.length} 门课 · ${formatNumber(credits)} 学分</div></div>
              ${items.map((course) => `
                <div class="course-row">
                  <div><div class="course-title">${escapeHtml(course.title || "未填写课程")}</div><div class="course-code">${escapeHtml(course.courseCode || "无代码")}</div></div>
                  <div class="school">${escapeHtml(course.school || "未填写学校")}</div>
                  <div class="credits"><strong>${formatNumber(course.credits)}</strong> 学分</div>
                  <span class="status ${statusClass(course.status)}">${escapeHtml(course.status || "待完成")}</span>
                </div>
              `).join("") || `<div class="empty">这个学期暂时没有课程</div>`}
            </article>
          `;
        }).join("")}</div>`;
      }

      function renderActivities(activities) {
        const counts = CATEGORIES
          .map((category) => ({ category, count: activities.filter((activity) => activity.category === category).length }))
          .filter((item) => item.count);
        return `
          <article class="card">
            <div class="section-head"><h3>课外活动</h3><div class="term-total">${activities.length} 条记录</div></div>
            <p class="guidance">目标 UCLA/UCB 需要至少准备 20 个课外活动，申请时再做筛选。目标私校需要有标化考试：托福、雅思或多邻国；SAT 若能有，会更有加分。</p>
            ${counts.length ? `<div class="category-pills">${counts.map((item) => `<span>${escapeHtml(item.category)} ${item.count}</span>`).join("")}</div>` : ""}
            ${activities.length ? activities.map((activity) => `
              <div class="activity-row">
                <div class="activity-category">${escapeHtml(activity.category || "未分类")}</div>
                <span class="activity-status ${statusClass(normalizeActivityStatus(activity.status))}">${escapeHtml(normalizeActivityStatus(activity.status))}</span>
                <div class="activity-name">${escapeHtml(activity.name || "未填写活动名字")}</div>
                <div class="activity-time">${escapeHtml(activity.activityTime || "未填写时间")}</div>
                <div class="activity-hours">${activity.category === "Volunteer" ? `${formatNumber(activity.volunteerHours)} 小时` : " "}</div>
                <div class="activity-note">${escapeHtml(activity.note || "暂无备注")}</div>
              </div>
            `).join("") : `<div class="empty">暂时没有课外活动记录</div>`}
          </article>
        `;
      }

      loadSession();
    </script>
  </body>
</html>
