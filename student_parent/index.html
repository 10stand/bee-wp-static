<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面已迁移 · Beecoming Student Portal</title>
    <link rel="icon" href="/wp-content/themes/mingque/favicon.ico" />
    <link rel="canonical" href="https://www.beecoming.com/student_portal" />
    <!-- Fallback for when scripting is unavailable; the script below runs first -->
    <meta http-equiv="refresh" content="0; url=/student_portal/" />
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        color: #171b2a;
        background:
          radial-gradient(circle at 88% 8%, rgba(255, 199, 44, 0.18), transparent 28rem),
          radial-gradient(circle at 0 0, rgba(111, 66, 255, 0.12), transparent 31rem),
          #fbfbff;
      }

      .card {
        width: min(26rem, 100%);
        padding: 2.4rem 2rem;
        border: 1px solid #e3e7ef;
        border-radius: 1.2rem;
        background: #fff;
        box-shadow: 0 18px 50px rgba(29, 23, 74, 0.09);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.3rem;
      }

      p {
        margin: 0 0 1.4rem;
        color: #6f7586;
        font-weight: 700;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0 1.4rem;
        border-radius: 0.95rem;
        background: #6f42ff;
        color: #fff;
        font-weight: 900;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(111, 66, 255, 0.24);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>页面已迁移</h1>
      <p>学生档案已移至新地址，正在为你跳转…</p>
      <a href="/student_portal/">立即前往</a>
    </main>
    <script>
      // replace() rather than assign() so Back does not bounce between the two
      location.replace("/student_portal/" + location.search + location.hash);
    </script>
  </body>
</html>
